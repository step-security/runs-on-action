name: CI

# Every branch of this repository, so a pull request gets the suites whatever
# its branch is called. Pull requests from forks are not built here: the
# suites run on RunsOn runners and publish a mirror.
on:
  push:
    branches-ignore:
      - dist/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      UPX_VERSION: 5.0.2
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install UPX
        shell: bash
        run: |
          set -euo pipefail
          upx_archive="upx-${UPX_VERSION}-amd64_linux.tar.xz"
          curl -fsSL \
            -o "${RUNNER_TEMP}/${upx_archive}" \
            "https://github.com/upx/upx/releases/download/v${UPX_VERSION}/${upx_archive}"
          tar -xJf "${RUNNER_TEMP}/${upx_archive}" -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/upx-${UPX_VERSION}-amd64_linux" >> "${GITHUB_PATH}"
      - name: Test
        run: go test ./...
      - name: Build
        run: make build
      # A tarball keeps the binaries' executable bit, which artifacts drop.
      - name: Package
        run: tar -cf dist.tar main-linux-amd64 main-linux-arm64 main-windows-amd64.exe index.js post.js
      # Artifacts belong to this run, so every run has its own "dist". A
      # re-run of all jobs replaces it instead of failing on the name.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist.tar
          if-no-files-found: error
          overwrite: true

  container:
    needs: build
    uses: ./.github/workflows/test-container.yml
  default:
    needs: build
    uses: ./.github/workflows/test-default.yml
