name: Test / Default
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  github:
    name: GitHub runners
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.actor == 'dependabot[bot]' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest", "windows-latest", "macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go for Windows unit tests
        if: runner.os == 'Windows'
        uses: actions/setup-go@v6.4.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Run Windows sticky-cache unit tests
        if: runner.os == 'Windows'
        run: go test ./internal/stickydisk
      # expectation: this is just a noop on managed runners
      - uses: ./
      - run: sleep 30